spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ccb_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:ccb}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      bootstrap_admin_password_hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
ccb:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-millis: ${JWT_ACCESS_TTL_MILLIS:900000}
      refresh-ttl-millis: ${JWT_REFRESH_TTL_MILLIS:604800000}

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:ccb-platform}
      presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:3600}
  file-preview:
    enabled: ${FILE_PREVIEW_ENABLED:true}
    kk-base-url: ${KK_FILE_VIEW_BASE_URL:}
    max-file-size-bytes: ${FILE_PREVIEW_MAX_FILE_SIZE_BYTES:52428800}
    allowed-extensions: ${FILE_PREVIEW_ALLOWED_EXTENSIONS:pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,csv,jpg,jpeg,png,gif,bmp,webp}
  mock-data:
    enabled: ${MOCK_DATA_ENABLED:true}
    resource: ${MOCK_DATA_RESOURCE:classpath:mock/mock-data.json}
  workflow:
    seeded-definition-publisher:
      enabled: ${WORKFLOW_SEEDED_DEFINITION_PUBLISHER_ENABLED:true}
      tenant-id: ${WORKFLOW_SEEDED_DEFINITION_TENANT_ID:1}
      operator-user-id: ${WORKFLOW_SEEDED_DEFINITION_OPERATOR_USER_ID:1}
      definition-codes: ${WORKFLOW_SEEDED_DEFINITION_CODES:architecture.subsystem.change,architecture.resource-request}
