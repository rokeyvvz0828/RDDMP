name: 需求
description: 创建满足研发准入条件的功能需求
title: "[REQ] "
labels: ["requirement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 业务目标
      description: 谁在什么场景解决什么问题，以及可观察的成功结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非范围
      description: 分别列出本次实施和不实施内容。
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 模块与 Owner
      placeholder: platform/system - rokeyvvz0828
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可观察、可测试的结果描述。
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 数据、权限、迁移和外部访问
      description: 说明影响、脱敏要求、测试及回退；无影响也请明确写无。
    validations:
      required: true
