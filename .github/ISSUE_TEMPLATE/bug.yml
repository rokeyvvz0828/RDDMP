name: 缺陷
description: 报告可复现的功能或工程缺陷
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际结果
      description: 使用脱敏数据描述页面、接口、日志摘要或错误。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 包含环境、角色、入口和最小步骤，不要提交凭据或生产数据。
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 影响模块
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 影响与临时处置
