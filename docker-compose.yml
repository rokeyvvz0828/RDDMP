services:
  mysql:
    image: mysql:8.4
    container_name: ccb-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ccb_platform
      MYSQL_USER: ccb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      - "3306:3306"
    volumes:
      - ccb-platform-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ccb-platform-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ccb-platform-minio-data:/data
    command: server /data --console-address ":9001"

  kkfileview:
    image: keking/kkfileview:latest
    container_name: ccb-platform-kkfileview
    restart: unless-stopped
    environment:
      KK_SERVER_PORT: 8012
      KK_BASE_URL: ${KK_FILE_VIEW_BASE_URL:?KK_FILE_VIEW_BASE_URL must be set}
      KK_TRUST_HOST: ${KK_FILE_VIEW_TRUST_HOST:?KK_FILE_VIEW_TRUST_HOST must be set}
      KK_NOT_TRUST_HOST: ${KK_FILE_VIEW_NOT_TRUST_HOST:?KK_FILE_VIEW_NOT_TRUST_HOST must be set}
      KK_PDF_DOWNLOAD_DISABLE: "true"
      KK_PDF_PRINT_DISABLE: "true"
      KK_CACHE_CLEAN_ENABLED: "true"
    ports:
      - "${KK_FILE_VIEW_PORT:-8012}:8012"

volumes:
  ccb-platform-mysql-data:
  ccb-platform-minio-data:
