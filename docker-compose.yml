services:
  mysql:
    image: mysql:8.4
    container_name: ccb-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ccb_platform
      MYSQL_USER: ccb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      - "3306:3306"
    volumes:
      - ccb-platform-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  ccb-platform-mysql-data:
