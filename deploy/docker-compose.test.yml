name: rddmp-test

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ccb_platform
      MYSQL_USER: ccb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 700m
    memswap_limit: 900m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data
    volumes:
      - minio-data:/data
    mem_limit: 384m
    memswap_limit: 512m

  kkfileview:
    image: keking/kkfileview:4.1.0
    restart: unless-stopped
    environment:
      KK_SERVER_PORT: "8012"
      KK_BASE_URL: ${PUBLIC_SCHEME:-http}://${PREVIEW_HOST:?PREVIEW_HOST must be set}${PUBLIC_PORT_SUFFIX:-}
      KK_TRUST_HOST: minio
      KK_NOT_TRUST_HOST: localhost,127.0.0.1,0.0.0.0,10.*,192.168.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*
      KK_PDF_DOWNLOAD_DISABLE: "true"
      KK_PDF_PRINT_DISABLE: "true"
      KK_CACHE_CLEAN_ENABLED: "true"
    mem_limit: 1280m
    memswap_limit: 2048m

  backend:
    image: rddmp/backend:${RDDMP_IMAGE_TAG:?RDDMP_IMAGE_TAG must be set}
    restart: unless-stopped
    extra_hosts:
      - "${FILES_HOST:?FILES_HOST must be set}:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      kkfileview:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/ccb_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ccb
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TTL_MILLIS: "900000"
      JWT_REFRESH_TTL_MILLIS: "604800000"
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:?BOOTSTRAP_ADMIN_PASSWORD_HASH must be set}
      MINIO_ENDPOINT: ${PUBLIC_SCHEME:-http}://${FILES_HOST:?FILES_HOST must be set}${PUBLIC_PORT_SUFFIX:-}
      MINIO_PREVIEW_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ccb-platform
      MINIO_PRESIGNED_EXPIRY_SECONDS: "3600"
      FILE_PREVIEW_ENABLED: "true"
      FILE_PREVIEW_MAX_FILE_SIZE: 50MB
      FILE_PREVIEW_MAX_FILE_SIZE_BYTES: "52428800"
      KK_FILE_VIEW_BASE_URL: ${PUBLIC_SCHEME:-http}://${PREVIEW_HOST}${PUBLIC_PORT_SUFFIX:-}
      MOCK_DATA_ENABLED: "true"
      MOCK_DATA_RESOURCE: classpath:mock/mock-data.json
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1050m
    memswap_limit: 1400m

  gateway:
    image: rddmp/web:${RDDMP_IMAGE_TAG:?RDDMP_IMAGE_TAG must be set}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST must be set}
      APP_PORT: ${APP_PORT:-8088}
      FILES_HOST: ${FILES_HOST}
      PREVIEW_HOST: ${PREVIEW_HOST}
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:${APP_PORT:-8088}"
    networks:
      default:
        aliases:
          - ${FILES_HOST}
          - ${PREVIEW_HOST}
    mem_limit: 128m
    memswap_limit: 160m

volumes:
  mysql-data:
  minio-data:
