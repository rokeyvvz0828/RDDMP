    "note": "除 V84-V98 外，因合并 REQ-20260831-050 而纳入追加式迁移 V99-V102（均落在 platform/infrastructure，仅追加不改历史脚本，com.ccb.infrastructure.storage 公共契约未变）；V102 为统一回收站菜单注册；V103 为 dm_meeting 增加 meeting_code（会议编号）与活动域唯一索引，用于向统一回收站信封 asset_code 提供来源。演示数据不再通过 Flyway 注入，改由测试/本地 fixture 提供。业务 API 破坏性变更属 business/data-migration 模块，非平台公共能力；T26 下线 business/data-migration 旧前端入口 /meetings/recycle-bin* 与 /reports/recycle-bin*（含 /meetings/purge-all），不属平台契约。T27 修复 T26 剩余风险：(1) 各来源 restore 翻转 deleted=0 时的活动编号唯一冲突统一翻译为 CONFLICT(40900)，与 create 同构；(2) MeetingController/ReportController 数字型 PathVariable 加 \\d+ 正则约束，旧字面路径不再被 /{id} 吞掉；(4)(5) RecycleBinSource SPI 由全量 listDeleted 改为 countDeleted + listDeletedPage(limit)，各来源 SQL 层按业务编号升序 + LIMIT 原生分页，统一层做有界 k 路归并 + SQL COUNT 总量；仍属 business/data-migration 模块内部契约，非平台公共能力，无新增迁移。T32（2026-09-03）追加：数据迁移模块服务端项目隔离（requirement.md「增量：数据迁移模块服务端项目隔离（T32）」，决策 D1-D4）。改动仍限 server/src/modules/data-migration/**、web/src/api/data-migration.ts、web/src/modules/data-migration/**，不新增 Flyway（实测各 dm_* 表查询索引已含 project_id），不修改 platform/shared。D1 最终决策：成员和项目可达性统一调用 platform/system 公开契约 `com.ccb.system.capability.ProjectWorkflowDirectoryService`，data-migration 不读取或写入 pm_project_member/pm_project SQL；pm_project_member 继续由 platform/system 持有并服务成员、角色、项目范围和工作流人员解析。影响：business/data-migration 模块内部项目查询 projectId 必填、统一回收站/看板/check-md5/导入增加项目维度、UPDATE 去掉 project_id，非平台公共能力；服务端项目隔离不得回退到跨项目查询。T32 范围补登：本分支既有提交已改 `.gitignore`（仅追加忽略本地 `.qoder/`）与 T30 设计文档 `docs/engineering-control/designs/2026-09-02-data-migration-plan-domain-design.md`，此前未登记在 writable_paths 中，现补入以满足范围检查可复验；两项均不涉及平台能力与运行行为。T34（2026-09-04）追加：9.2 四项 P2 治理收敛——追加迁移 V171-V173（子系统 id 引用列按 (tenant_id, code) 回填、组件/目标表/字段唯一键收敛为活动生成列、生成列注释补齐），服务端写入时解析 arch_physical_subsystem.id 双写（IssueService/ProjectComponentService/TargetTableService，前端 systemCode 契约不变、查询仍按 code 过滤），组件看板改跨 9 张内容表一次 UNION ALL 分组统计；仍限 data-migration 模块与追加迁移文件，platform/shared 未改。T39（2026-09-04，用户确认开发阶段免备份）追加：系统关联统一为 (project_id, system_code) 并追加 V175 下线 V168/V171 的 id 引用列（dm_plan.system_id→system_code、dm_issue/dm_target_table 删 system_id、dm_component 删 physical_subsystem_id、dm_meeting_system 改 project_id+system_code），服务端不再解析/双写 arch_physical_subsystem.id，按项目内 dm_component 活动清单校验关联系统，系统名称经 dm_component 按编号投影；后端 PlanService/IssueService/TargetTableService/ProjectComponentService/MeetingService 与 Plan/Meeting 前端契约由 systemId/systemIds 改为 systemCode/systemCodes；仍限 data-migration 模块与追加迁移文件，platform/shared 未改。T40（2026-09-04）追加：9.2 P1「审计缺项目维度」治理——追加 V176 为 dm_operation_log 增加 project_id（BIGINT NOT NULL DEFAULT 0）与项目级审计索引 (tenant_id, project_id, entity_type, created_at)，服务端各审计写入口（PlanService/MeetingService/IssueService/TargetTableService/ContentFileAssetService/StructuredAssetService/ReportService/ProjectComponentService/ExcelService）从实体项目上下文填充审计项目，清空回收站类操作记录操作范围；仍限 data-migration 模块与追加迁移文件，platform/shared 未改。T41（2026-09-04，用户确认开发阶段免备份）追加：dm_target_table 取消自增 id 主键，改为 table_code 直接作主键（编号沿用原 id 生成方式 nextId() 纯数字 BIGINT、全局唯一、单列主键、不建号源表、不考虑租户），dm_target_table_field 主键同步改 field_code、关联键 table_id 改名 table_code，dm_issue_relation.related_id 与审计 entity_id 存的正是原 id 数值即新 code 数值（数据零改写），V172 遗留引用 table_id 的 uk_target_field_active_en/cn 与 idx_target_field_table/key 随改名重建，组合外键 fk_target_field_table_code 按 (tenant_id, table_code) 关联，保留 uk_target_table_tenant_code (tenant_id, table_code) 作组合外键引用目标；服务端 TargetTableService/TargetTableController/TargetTableFieldController/IssueService/IssueController 与前端 data-migration.ts/TargetTablesPage/IssuesPage 契约由 id/tableId/fieldId/ids 改为 tableCode/fieldCode/tableCodes/fieldCodes；仍限 data-migration 模块与追加迁移文件，platform/shared 未改。T42（2026-09-04，用户确认开发阶段免备份）追加：全模块下线 active_* 活动生成列并改朴素唯一键（V178）——dm_issue/dm_meeting/dm_plan/dm_component/dm_target_table/dm_target_table_field/8 张内容表/dm_content_attachment 删除 active_* 生成列，唯一键直接建在原始业务列上（租户+项目+业务编号或租户+业务键），软删行同样占用唯一名额，删除后需 purge 才能重建同名/同编号记录，恢复只与存量活动行冲突；服务端创建/更新预校验改为含软删行的全量检查，数据库唯一键并发兜底；仍限 data-migration 模块与追加迁移文件，platform/shared 未改。T43（2026-09-05，用户确认）追加：dm_project 已完全废弃，追加 V179（DROP