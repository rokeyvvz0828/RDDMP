    "regression_tests": ["module-boundary", "maven-reactor", "dynamic-menu", "frontend-build"],
    "note": "除 V84-V98 外，因合并 REQ-20260831-050 而纳入追加式迁移 V99-V102（均落在 platform/infrastructure，仅追加不改历史脚本，com.ccb.infrastructure.storage 公共契约未变）；V102 为统一回收站菜单注册；V103 为 dm_meeting 增加 meeting_code（会议编号）与活动域唯一索引，用于向统一回收站信封 asset_code 提供来源；V104 提供 3 行显式 meeting_code 的演示 seed，展示新建会议时显式编号的推荐范式。业务 API 破坏性变更属 business/data-migration 模块，非平台公共能力；T26 下线 business/data-migration 旧前端入口 /meetings/recycle-bin* 与 /reports/recycle-bin*（含 /meetings/purge-all），不属平台契约。T27 修复 T26 剩余风险：(1) 各来源 restore 翻转 deleted=0 时的活动编号唯一冲突统一翻译为 CONFLICT(40900)，与 create 同构；(2) MeetingController/ReportController 数字型 PathVariable 加 \\d+ 正则约束，旧字面路径不再被 /{id} 吞掉；(4)(5) RecycleBinSource SPI 由全量 listDeleted 改为 countDeleted + listDeletedPage(limit)，各来源 SQL 层按业务编号升序 + LIMIT 原生分页，统一层做有界 k 路归并 + SQL COUNT 总量；仍属 business/data-migration 模块内部契约，非平台公共能力，无新增迁移。"
  },
