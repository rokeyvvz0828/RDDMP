    "compatibility_and_rollback": "Append-only MySQL 8.4 migrations. V84-V95 establish the data-migration model; V96 adds meeting attachment relations; V97 adds comments and the (now unused) topic type table; V98 removes dm_meeting.project_name/attachment_id/file_name, dm_issue.system_name, dm_target_table_field.table_code and dm_asset.object_key, drops dm_topic_type, deduplicates active meeting attachments, and adds tenant-prefixed indexes plus an active attachment uniqueness key. Before applying V98, environments must verify that dm_asset rows with object_key have been converted to att_file bindings; the application no longer supports object-key fallback after V98. V103 additionally backfills existing dm_meeting rows with `MEET-{meeting_id}` and enforces uniqueness only for active rows via a generated column. T34 (REQ-20260820-031 9.2 P2 治理) additionally appends V171 (dm_issue/dm_target_table/dm_component subsystem id reference columns with (tenant_id, code) backfill and id-based indexes), V172 (component/target-table/field unique keys converged to active generated columns) and V173 (active-code generated-column comments); each is additive and conditionally executed, no published script edited. T39 (user-approved 口径) additionally appends V175 which decommissions the arch_physical_subsystem.id references: dm_plan.system_id -> system_code (project-level empty-string sentinel) with active_dimension_key/uk/index rebuilt, dm_issue/dm_target_table/drop system_id and id indexes, dm_component drops physical_subsystem_id and index, dm_meeting_system switches subsystem_id to project_id + system_code (backfilled from dm_meeting/arch code); all statements are information_schema-guarded and idempotent. T40 (user-approved 口径) additionally appends V176 which adds dm_operation_log.project_id (BIGINT NOT NULL DEFAULT 0, placed after tenant_id) and the project-level audit index idx_dm_operation_log_project (tenant_id, project_id, entity_type, created_at); write side fills project_id from the entity's stored project (create/import use the operation scope, storage-purge-all operations record the project scope); existing rows keep 0 and are excluded from project-level queries until a compensation backfill; all statements are information_schema-guarded and idempotent. T41 (user-approved 口径) additionally appends V177 which converts dm_target_table/dm_target_table_field primary keys to business codes: backfills table_code/field_code with the old id values, drops the id columns, promotes table_code/field_code to single-column PKs, renames field-table table_id to table_code, rebuilds the generated active-code columns as BIGINT, rebuilds uk_target_field_active_en/cn and idx_target_field_table/key on table_code, and swaps the old fk_target_field_table(id) foreign key for the composite fk_target_field_table_code (tenant_id, table_code) against uk_target_table_tenant_code; dm_issue_relation.related_id and dm_operation_log.entity_id keep the numeric code values unchanged (zero-data rewrite); all statements are information_schema-guarded and idempotent. Rollback is application rollback only (retain migrated tables/objects); restoring dropped columns requires a separately approved forward compensation migration and database backup (dev stage: no backup required per user). T42 (user-approved 口径) additionally appends V178 which removes all active_* generated uniqueness columns across the module (dm_issue, dm_meeting, dm_plan, dm_component, dm_target_table, dm_target_table_field, the 8 content tables and dm_content_attachment) and puts unique keys directly on the original business columns: dm_issue (tenant_id, project_id, issue_code), dm_meeting (tenant_id, project_id, meeting_code), dm_plan (tenant_id, project_id, doc_code) plus plan dimension (tenant_id, project_id, granularity, plan_type, system_code), dm_component (tenant_id, project_id, physical_subsystem_code), dm_target_table (tenant_id, project_id, system_code, table_name_en/cn), dm_target_table_field (tenant_id, table_code, field_name_en/cn), content tables (tenant_id, project_id, doc_code) and dm_content_attachment (tenant_id, business_type, business_id, attachment_id); soft-deleted rows keep occupying their unique slots so a same-name/same-code record can only be recreated after purge, restore conflicts are rejected by the database unique keys, and the service-layer pre-checks now validate against the full row set including deleted rows; all statements are information_schema-guarded and idempotent. Rollback is application rollback only (retain migrated tables/objects); restoring dropped columns requires a separately approved forward compensation migration and database backup (dev stage: no backup required per user). T43 (user-approved 口径) additionally appends V179 which drops the deprecated dm_project table (DROP TABLE IF EXISTS dm_project, idempotent); project master data stays with platform pm_project; no published script edited and no platform/shared surface changed. Rollback is application rollback only (retain migrated tables/objects); restoring dm_project requires a separately approved forward compensation migration and database backup (dev stage: no backup required per user)."
